<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Asistencia · Plásticos Carmen</title>
<!-- Reemplazar la URL por la del sistema PHP una vez desplegado. -->
<meta http-equiv="refresh" content="0; url=https://tablero-asistencia.onrender.com/">
<link rel="canonical" href="https://tablero-asistencia.onrender.com/">
<style>
  :root { --brand:#003080; --page:#EDF0F6; --ink:#0D1B2E; --muted:#78879F; --ring:rgba(13,27,46,.13); }
  * { box-sizing:border-box }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
         background:var(--page); color:var(--ink);
         font-family:'Segoe UI',Calibri,system-ui,sans-serif; line-height:1.55 }
  .caja { max-width:520px; text-align:center; background:#fff; border:1px solid var(--ring);
          border-radius:16px; padding:34px 28px; box-shadow:0 1px 2px rgba(13,27,46,.05) }
  .mark { width:46px; height:46px; margin:0 auto 16px; border-radius:12px; background:var(--brand);
          color:#fff; display:grid; place-items:center; font-weight:700; letter-spacing:.02em }
  h1 { margin:0 0 10px; font-size:19px }
  p { margin:0 0 18px; font-size:14px; color:#44546F }
  a.btn { display:inline-block; padding:11px 20px; border-radius:10px; background:var(--brand);
          color:#fff; text-decoration:none; font-size:14px; font-weight:600 }
  small { display:block; margin-top:18px; font-size:12px; color:var(--muted) }
</style>
</head>
<body>
  <main class="caja">
    <div class="mark" aria-hidden="true">PC</div>
    <h1>El tablero se mudó</h1>
    <p>
      El Control de Asistencia ahora corre como aplicación PHP, con los datos y el
      cálculo en el servidor. Te estamos llevando allá.
    </p>
    <a class="btn" href="https://tablero-asistencia.onrender.com/">Ir al tablero</a>
    <small>Si no pasa nada en unos segundos, usá el botón.</small>
  </main>
</body>
</html>
